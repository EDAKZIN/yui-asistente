<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yui - Panel de Control</title>
    <link rel="stylesheet" href="control-panel.css">
</head>

<body>
    <div class="container">
        <!-- Header con estado -->
        <header class="header">
            <div class="logo">
                <span class="logo-text">Yui</span>
                <span class="version">v6.2</span>
            </div>
            <div class="status-group">
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">Conectando...</span>
                </div>
                <div class="llm-indicator" id="llmIndicator" title="Modelo LLM activo">
                    <span class="llm-badge" id="llmBadge">Local</span>
                </div>
                <div class="mute-indicator" id="muteIndicator" style="display: none;">
                    <span class="mute-icon">🔇</span>
                </div>
            </div>
        </header>

        <!-- Panel principal -->
        <main class="main-content">
            <!-- Visualizador de audio/estado -->
            <div class="audio-visualizer" id="audioVisualizer">
                <div class="waveform" id="waveform">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <div class="state-icon" id="stateIcon">
                    <svg viewBox="0 0 24 24" class="mic-icon" id="micIcon">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                        <path
                            d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                    </svg>
                </div>
            </div>

            <!-- Panel Más Opciones -->
            <div class="more-options-panel" id="moreOptionsPanel">
                <div class="more-options-header" id="moreOptionsHeader">
                    <span>Más opciones</span>
                    <svg class="chevron-icon" id="chevronIcon" viewBox="0 0 24 24" width="16" height="16">
                        <path d="M7 10l5 5 5-5z" fill="currentColor" />
                    </svg>
                </div>
                <div class="more-options-content" id="moreOptionsContent">
                    <div class="options-list">
                        <!-- Monitor VRAM/RAM -->
                        <div class="option-row">
                            <div class="option-info">
                                <svg viewBox="0 0 24 24" width="18" height="18">
                                    <path
                                        d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"
                                        fill="currentColor" />
                                </svg>
                                <span>Monitor VRAM/RAM</span>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="memoryMonitor">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <!-- Logs Detallados -->
                        <div class="option-row">
                            <div class="option-info">
                                <svg viewBox="0 0 24 24" width="18" height="18">
                                    <path
                                        d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zm-9-7h6v2H9v-2zm0 4h6v2H9v-2z"
                                        fill="currentColor" />
                                </svg>
                                <span>Logs Detallados</span>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="detailedLogs">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <!-- Consola -->
                        <div class="option-row">
                            <div class="option-info">
                                <svg viewBox="0 0 24 24" width="18" height="18">
                                    <path
                                        d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10zM7.5 17l-1.41-1.41L8.67 13l-2.59-2.59L7.5 9l4 4-4 4z"
                                        fill="currentColor" />
                                </svg>
                                <span>Consola</span>
                            </div>
                            <button class="option-btn" id="consoleToggleBtn">
                                <span id="consoleToggleText">Mostrar</span>
                            </button>
                        </div>

                        <!-- Sesión -->
                        <div class="option-row">
                            <div class="option-info">
                                <svg viewBox="0 0 24 24" width="18" height="18">
                                    <path
                                        d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"
                                        fill="currentColor" />
                                </svg>
                                <span>Sesión</span>
                            </div>
                            <div class="session-stats">
                                <span id="statUptime">--</span> · <span id="statConversations">--</span> chats
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Controles -->
        <footer class="controls">
            <button class="btn-control btn-mute" id="btnMute" title="Silenciar/Activar micrófono">
                <svg viewBox="0 0 24 24" class="control-icon" id="muteIcon">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                    <path
                        d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                </svg>
                <span class="btn-label">Silenciar</span>
            </button>

            <button class="btn-control btn-sleep" id="btnSleep" title="Modo reposo">
                <svg viewBox="0 0 24 24" class="control-icon">
                    <path
                        d="M12.34 2.02C6.59 1.82 2 6.42 2 12c0 5.52 4.48 10 10 10 3.71 0 6.93-2.02 8.66-5.02-7.51-.25-12.09-8.43-8.32-14.96z" />
                </svg>
                <span class="btn-label">Reposo</span>
            </button>

            <button class="btn-control btn-performance" id="btnPerformance" title="Modo rendimiento (Groq)">
                <svg viewBox="0 0 24 24" class="control-icon">
                    <path d="M7 2v11h3v9l7-12h-4l4-8z" />
                </svg>
                <span class="btn-label">Rendimiento</span>
            </button>

            <button class="btn-control btn-settings" id="btnSettings" title="Configuración">
                <svg viewBox="0 0 24 24" class="control-icon">
                    <path
                        d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                </svg>
                <span class="btn-label">Config</span>
            </button>
        </footer>
    </div>

    <!-- Modal de configuración -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configuración</h2>
                <button class="btn-close" id="btnCloseSettings">✕</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>Tecla de Mute</label>
                    <div class="keybind-input" id="muteKeybind">
                        <span id="currentMuteKey">...</span>
                        <button class="btn-change-key" id="btnChangeMuteKey">Cambiar</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label>Umbral VAD</label>
                    <input type="range" id="vadThreshold" min="0.3" max="0.9" step="0.05" value="0.65">
                    <span id="vadThresholdValue">0.65</span>
                </div>
                <div class="setting-group">
                    <label>Comentarios Proactivos</label>
                    <label class="switch">
                        <input type="checkbox" id="proactiveEnabled" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Indicador de conexión -->
    <div class="connection-status" id="connectionStatus">
        <span class="connection-dot"></span>
        <span class="connection-text">Desconectado</span>
    </div>

    <script type="module" src="dist/control-panel.js"></script>
</body>

</html>
