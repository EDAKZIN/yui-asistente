<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' ws://localhost:58765 blob: data:">
    <title>Yui Desktop Pet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #live2d-canvas {
            width: 100%;
            height: 100%;
            transition: opacity 0.3s ease;
        }

        .loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            text-shadow: 0 0 5px black;
        }

        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            font-family: sans-serif;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            white-space: pre-line;
            border-radius: 8px;
            max-width: 300px;
        }

        .config-mode #canvas-container {
            background: rgba(0, 200, 255, 0.15);
            border: 2px dashed rgba(0, 200, 255, 0.6);
            border-radius: 8px;
        }

        .config-mode .config-hint {
            display: block !important;
        }

        .config-hint {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #0cf;
            padding: 8px 15px;
            border-radius: 15px;
            font-family: sans-serif;
            font-size: 11px;
            white-space: nowrap;
        }

        .drag-mode #canvas-container {
            cursor: move;
        }

        .drag-mode .drag-hint {
            display: block !important;
        }

        .drag-hint {
            display: none;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 150, 0, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 10px;
            font-family: sans-serif;
            font-size: 11px;
        }

        .translucent-mode #live2d-canvas {
            opacity: 0.3;
        }

        .translucent-mode #subtitle-text {
            opacity: 0.3;
        }

        /* Subtítulos */
        #subtitle-container {
            position: absolute;
            top: 40%;
            /* Posicionado a altura del torso del modelo */
            left: 50%;
            transform: translate(-50%, -50%);
            /* Centrado tanto horizontal como vertical */
            max-width: 90%;
            pointer-events: none;
            z-index: 9999;
            /* Muy por encima de todo */
            -webkit-app-region: no-drag;
            /* CRÍTICO: Forzar renderizado en ventana transparente */
            will-change: transform;
            /* Optimización GPU */
        }

        #subtitle-text {
            background: rgba(0, 0, 0, 0.95);
            /* Más opaco para mejor visibilidad */
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            font-family: 'Arial', sans-serif;
            font-size: 18px;
            line-height: 1.4;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: none;
            min-height: 20px;
            min-width: 200px;
            /* Asegurar que sea visible */
            -webkit-font-smoothing: antialiased;
            /* Mejor renderizado de texto */
            backface-visibility: hidden;
            /* Fix para glitches de render */
        }

        #subtitle-text.user-text {
            background: rgba(20, 100, 200, 0.9);
            border-color: rgba(100, 180, 255, 0.4);
        }

        #subtitle-text.yui-text {
            background: rgba(100, 20, 150, 0.9);
            border-color: rgba(200, 100, 255, 0.4);
        }

        #subtitle-text.show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Modo Config de Subtitulos */
        .subtitle-config-mode #subtitle-container {
            border: 3px dashed cyan;
            background: rgba(0, 255, 255, 0.1);
            pointer-events: auto;
        }

        .subtitle-config-mode #subtitle-text {
            display: block !important;
            border: 2px solid cyan !important;
        }

        .subtitle-config-mode #subtitle-placeholder {
            display: none !important;
        }

        .subtitle-config-mode .subtitle-hint {
            display: block !important;
        }

        .subtitle-hint {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: cyan;
            padding: 8px 15px;
            border-radius: 15px;
            font-family: sans-serif;
            font-size: 11px;
            white-space: nowrap;
            z-index: 10001;
        }

        /* Controles de Subtitulos */
        #subtitle-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #fff;
            display: none;
            z-index: 10000;
        }

        #subtitle-controls.show {
            display: block;
        }

        #subtitle-controls button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 4px 8px;
            margin: 2px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        #subtitle-controls button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .subtitle-control-row {
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .subtitle-control-label {
            min-width: 60px;
            font-size: 11px;
        }

        /* Controles de Items 3D */
        #item-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #fff;
            display: none;
            z-index: 10000;
            min-width: 160px;
        }

        #item-controls.show {
            display: block;
        }

        #item-controls button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 3px 7px;
            margin: 1px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        #item-controls button:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .item-control-row {
            margin: 3px 0;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .item-control-label {
            min-width: 50px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
        }

        .item-section-title {
            font-size: 10px;
            color: #88ccff;
            margin-top: 6px;
            margin-bottom: 2px;
            border-bottom: 1px solid rgba(136, 204, 255, 0.3);
            padding-bottom: 2px;
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <canvas id="live2d-canvas"></canvas>
        <div class="loading-message" id="loadingMsg">Cargando...</div>
        <div class="config-hint">Rueda = escala</div>
        <div class="drag-hint">Arrastra para mover</div>

        <!-- Subtítulos -->
        <div id="subtitle-container">
            <div id="subtitle-text"></div>
            <div id="subtitle-placeholder" style="display:none;">▼ ÁREA DE SUBTÍTULOS ▼</div>
        </div>

        <!-- Controles de Subtitulos -->
        <div id="subtitle-controls">
            <div class="subtitle-control-row">
                <span class="subtitle-control-label">Posicion Y:</span>
                <button onclick="adjustSubtitleY(-5)">&#9650;</button>
                <button onclick="adjustSubtitleY(5)">&#9660;</button>
            </div>
            <div class="subtitle-control-row">
                <span class="subtitle-control-label">Tamano:</span>
                <button onclick="adjustSubtitleSize(-2)">-</button>
                <button onclick="adjustSubtitleSize(2)">+</button>
            </div>
            <div class="subtitle-control-row">
                <button onclick="toggleSubtitleControls()" style="width:100%">Cerrar</button>
            </div>
        </div>
        <div class="subtitle-hint">Controles en pantalla</div>

        <!-- Controles de Items 3D -->
        <div id="item-controls">
            <div style="font-size:11px; font-weight:bold; margin-bottom:4px;">Ajustar Tablet</div>
            <div class="item-section-title">Posicion</div>
            <div class="item-control-row">
                <span class="item-control-label">X:</span>
                <button onclick="adjustItemPos('x', -0.01)">&#9664;</button>
                <button onclick="adjustItemPos('x', 0.01)">&#9654;</button>
            </div>
            <div class="item-control-row">
                <span class="item-control-label">Y:</span>
                <button onclick="adjustItemPos('y', 0.01)">&#9650;</button>
                <button onclick="adjustItemPos('y', -0.01)">&#9660;</button>
            </div>
            <div class="item-control-row">
                <span class="item-control-label">Z:</span>
                <button onclick="adjustItemPos('z', -0.01)">&#9664;</button>
                <button onclick="adjustItemPos('z', 0.01)">&#9654;</button>
            </div>
            <div class="item-section-title">Rotacion</div>
            <div class="item-control-row">
                <span class="item-control-label">X:</span>
                <button onclick="adjustItemRot('x', -0.05)">&#9664;</button>
                <button onclick="adjustItemRot('x', 0.05)">&#9654;</button>
            </div>
            <div class="item-control-row">
                <span class="item-control-label">Y:</span>
                <button onclick="adjustItemRot('y', -0.05)">&#9664;</button>
                <button onclick="adjustItemRot('y', 0.05)">&#9654;</button>
            </div>
            <div class="item-control-row">
                <span class="item-control-label">Z:</span>
                <button onclick="adjustItemRot('z', -0.05)">&#9664;</button>
                <button onclick="adjustItemRot('z', 0.05)">&#9654;</button>
            </div>
            <div class="item-section-title">Escala</div>
            <div class="item-control-row">
                <span class="item-control-label">Tamano:</span>
                <button onclick="adjustItemScale(-0.1)">-</button>
                <button onclick="adjustItemScale(0.1)">+</button>
            </div>
        </div>
    </div>

    <!-- Three.js + VRM (reemplaza PIXI + Live2D) -->
    <script type="importmap">
    {
        "imports": {
            "three": "./node_modules/three/build/three.module.js",
            "three/addons/": "./node_modules/three/examples/jsm/",
            "@pixiv/three-vrm": "./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
            "vrm-mixamo-retarget": "./node_modules/vrm-mixamo-retarget/dist/index.esm.js"
        }
    }
    </script>

    <script type="module">
        // === THREE.JS + VRM IMPORTS ===
        import * as THREE from 'three';
        import { GLTFLoader } from './node_modules/three/examples/jsm/loaders/GLTFLoader.js';
        import { FBXLoader } from './node_modules/three/examples/jsm/loaders/FBXLoader.js';
        import { VRMLoaderPlugin, VRMUtils, MToonMaterialLoaderPlugin } from '@pixiv/three-vrm';
        import { retargetAnimation } from 'vrm-mixamo-retarget';

        // === SAFE MTOON LOADER PLUGIN ===
        // Intercepta la carga de materiales MToon para sanear texturas faltantes (VRM 0.0 -> 1.0/2.0)
        class SafeMToonMaterialLoaderPlugin extends MToonMaterialLoaderPlugin {
            async _parseMToonMaterial(materialJson, textureSplitter) {
                // Sanear texturas: si el índice es -1 o inválido, eliminar la referencia para evitar errores de colorSpace
                const textureKeys = ['mainTex', 'shadeTexture', 'bumpMap', 'rimMultiplyTexture', 't_SphereAdd', 'uvBoundMask'];
                const texProps = materialJson.textureProperties || {};

                console.log('[SafeMToon] Procesando material:', materialJson.name, materialJson.textureProperties);

                for (const key of textureKeys) {
                    // Si la propiedad existe pero es -1 (común en exports de UniVRM antiguos), borrarla
                    if (texProps[key] === -1) {
                        console.warn(`[SafeMToon] Eliminando textura inválida ${key} en material ${materialJson.name}`);
                        delete texProps[key];
                    }
                }

                return super._parseMToonMaterial(materialJson, textureSplitter);
            }
        }

        // === VARIABLES GLOBALES ===
        let currentConfig = null;
        let currentVRM = null;  // Reemplaza currentModel (ahora es VRM)
        let currentScale = 1.0;  // Escala base para VRM
        let saveTimeout = null;
        let canvasRect = null;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let configModeEnabled = false;

        // Three.js renderer, scene, camera
        let renderer = null;
        let scene = null;
        let camera = null;
        let clock = new THREE.Clock();
        // Luces (para control de brillo)
        let ambientLight = null;
        let directionalLight = null;
        let fillLight = null;

        // Mouse tracking suave
        let mouseTrackingEnabled = true;
        let motionPlaying = false;
        // Variables para LookAt (normalizadas 0.0 - 1.0)
        let targetMouseX = 0.5;
        let targetMouseY = 0.5;

        // === SISTEMA DE ANIMACIONES (FBX retargueteadas) ===
        let animMixer = null;               // THREE.AnimationMixer
        let isPlayingClipAnimation = false;  // Flag: un clip FBX esta activo
        let tabletModel = null;              // Modelo GLB de la tablet
        const animationClips = {};           // { 'hello': AnimationClip, 'tablet': AnimationClip }
        let vrmRestPose = null;              // Estado completo de huesos despues de la pose inicial
        let itemConfigMode = false;          // Modo ajuste de items activo

        // Escuchar posición del mouse desde Main Process (global tracking)
        if (window.electronAPI) {
            window.electronAPI.onMousePosition((pos) => {
                if (!mouseTrackingEnabled) return;
                // Normalizar coordenadas a 0..1 relativo a la ventana
                targetMouseX = pos.x / window.innerWidth;
                targetMouseY = pos.y / window.innerHeight;
            });
            // Activar tracking en main process
            window.electronAPI.startMouseTracking();
        } else {
            // Fallback para desarrollo en navegador web normal
            document.addEventListener('mousemove', (e) => {
                targetMouseX = e.clientX / window.innerWidth;
                targetMouseY = e.clientY / window.innerHeight;
            });
        }
        let targetX = 0;
        let targetY = 0;
        let currentLookX = 0;
        let currentLookY = 0;
        const LERP_SPEED = 0.08;

        // Lip-sync
        let isSpeaking = false;
        let currentUtteranceId = null;
        let smoothedMouthOpen = 0;
        const LIP_LERP_SPEED = 0.3;

        // Blink y Breath (timers para update)
        let blinkTimer = 0;
        let nextBlinkTime = 3 + Math.random() * 4;
        let breathTimer = 0;

        // Sistema de subtítulos
        let ws = null;
        let subtitleElement = null;
        let typewriterTimeout = null;
        let currentTypewriterIndex = 0;
        let pendingYuiResponse = null;
        let subtitleHideTimer = null;

        // Configuracion de subtitulos
        let subtitleConfig = {
            yPosition: 40,
            fontSize: 18
        };

        // Funciones de control de subtitulos
        function adjustSubtitleY(delta) {
            subtitleConfig.yPosition = Math.max(10, Math.min(90, subtitleConfig.yPosition + delta));
            const container = document.getElementById('subtitle-container');
            container.style.top = subtitleConfig.yPosition + '%';
            console.log('[Subtitulos] Posicion Y ajustada a: ' + subtitleConfig.yPosition + '%');
            saveSubtitleConfig();
        }

        function adjustSubtitleSize(delta) {
            subtitleConfig.fontSize = Math.max(12, Math.min(32, subtitleConfig.fontSize + delta));
            subtitleElement.style.fontSize = subtitleConfig.fontSize + 'px';
            console.log('[Subtitulos] Tamano ajustado a: ' + subtitleConfig.fontSize + 'px');
            saveSubtitleConfig();
        }

        function toggleSubtitleControls() {
            const controls = document.getElementById('subtitle-controls');
            controls.classList.toggle('show');
        }

        function saveSubtitleConfig() {
            if (window.electronAPI && window.electronAPI.saveSubtitleConfig) {
                window.electronAPI.saveSubtitleConfig(subtitleConfig).catch(function (err) {
                    console.error('[Subtitulos] Error guardando config:', err);
                });
            }
        }

        // Listener IPC para toggle de controles desde menu tray
        let subtitleConfigMode = false;
        const PREVIEW_TEXT = 'Este es un ejemplo de subtitulo para ver el tamaño';

        // Listener para modo configuracion de subtitulos (desde menu tray)
        if (window.electronAPI && typeof window.electronAPI.onSubtitleConfigMode === 'function') {
            window.electronAPI.onSubtitleConfigMode(function (enabled) {
                subtitleConfigMode = enabled;
                document.body.classList.toggle('subtitle-config-mode', enabled);
                const controls = document.getElementById('subtitle-controls');

                if (enabled) {
                    controls.classList.add('show');
                    // Mostrar preview con valores actuales
                    if (subtitleElement) {
                        subtitleElement.textContent = PREVIEW_TEXT;
                        subtitleElement.className = 'yui-text show';
                        subtitleElement.style.fontSize = subtitleConfig.fontSize + 'px';
                        subtitleElement.style.maxWidth = subtitleConfig.maxWidth + 'px';
                    }
                    console.log('[Subtitulos] Modo configuracion ACTIVADO - preview visible');
                } else {
                    controls.classList.remove('show');
                    // Ocultar preview
                    if (subtitleElement) {
                        subtitleElement.textContent = '';
                        subtitleElement.classList.remove('show');
                    }
                    console.log('[Subtitulos] Modo configuracion DESACTIVADO');
                }
            });
        }

        const TYPEWRITER_SPEED = 30;

        async function loadConfig() {
            try {
                const response = await fetch('./model-config.json');
                return await response.json();
            } catch (e) {
                return {
                    modelPath: './models/Yui.vrm',
                    scale: 1.0,
                    position: { x: 0, y: 0 }
                };
            }
        }

        function scheduleAutoSave() {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                currentConfig.scale = currentScale;
                window.electronAPI?.saveConfig(currentConfig);
                console.log('Escala auto-guardada:', currentScale.toFixed(2));
            }, 1000);
        }

        // Interpolacion lineal
        function lerp(start, end, factor) {
            return start + (end - start) * factor;
        }

        // === VRM: Actualizar LookAt con interpolacion suave ===
        function updateLookAt() {
            if (!currentVRM || !canvasRect) return;
            if (!mouseTrackingEnabled || motionPlaying) return;

            currentLookX = lerp(currentLookX, targetX, LERP_SPEED);
            currentLookY = lerp(currentLookY, targetY, LERP_SPEED);

            try {
                // VRM LookAt - mover target en espacio 3D
                if (currentVRM.lookAt) {
                    const lookTarget = new THREE.Vector3(
                        currentLookX * 2,  // X: izquierda/derecha
                        currentLookY * 2,  // Y: arriba/abajo
                        1.0                // Z: siempre adelante
                    );
                    currentVRM.lookAt.target = lookTarget;
                }
            } catch (e) {
                console.warn('[LookAt] Error:', e);
            }
        }

        // === VRM: Blinking automático ===
        function updateBlink(delta) {
            if (!currentVRM?.expressionManager) return;

            blinkTimer += delta;
            if (blinkTimer > nextBlinkTime) {
                // Blink!
                currentVRM.expressionManager.setValue('blink', 1);
                setTimeout(() => {
                    if (currentVRM?.expressionManager) {
                        currentVRM.expressionManager.setValue('blink', 0);
                    }
                }, 150);
                blinkTimer = 0;
                nextBlinkTime = 3 + Math.random() * 4;  // 3-7 segundos
            }
        }

        // === VRM: Lip-sync ===
        function updateLipSync() {
            if (!currentVRM?.expressionManager) return;

            // Si está hablando pero no recibe frames de audio, simular
            if (isSpeaking && smoothedMouthOpen < 0.05) {
                // Generar onda sinusoidal para simular movimiento de boca
                const t = performance.now() / 1000;
                const simulated = (Math.sin(t * 12) + 1) / 2 * 0.6 +
                    (Math.sin(t * 7) + 1) / 2 * 0.3;
                smoothedMouthOpen = simulated;
            }

            // Aplicar smoothedMouthOpen a expresión 'aa'
            currentVRM.expressionManager.setValue('aa', smoothedMouthOpen);

            // Si está hablando, reducir peso de otras expresiones
            // (se maneja en setEmotion)
        }

        // === VRM: Aplicar postura según emoción ===
        function applyPosturePreset(emotionName) {
            if (!currentVRM?.humanoid || !currentConfig?.posturePresets) return;

            const preset = currentConfig.posturePresets[emotionName] || currentConfig.posturePresets.neutral;
            if (!preset) return;

            try {
                const DEG_TO_RAD = Math.PI / 180;

                // Aplicar rotaciones a huesos (valores en grados → radianes)
                const chest = currentVRM.humanoid.getNormalizedBoneNode('chest');
                const head = currentVRM.humanoid.getNormalizedBoneNode('head');

                if (chest && preset.chestPitch !== undefined) {
                    chest.rotation.x = preset.chestPitch * DEG_TO_RAD;
                }
                if (chest && preset.chestYaw !== undefined) {
                    chest.rotation.y = preset.chestYaw * DEG_TO_RAD;
                }
                if (head && preset.headPitch !== undefined) {
                    head.rotation.x = preset.headPitch * DEG_TO_RAD;
                }
                if (head && preset.headYaw !== undefined) {
                    head.rotation.y = preset.headYaw * DEG_TO_RAD;
                }

                console.log('[Posture] Aplicada:', emotionName, preset);
            } catch (e) {
                console.warn('[Posture] Error aplicando:', e);
            }
        }

        // === VRM: Pose Inicial & Base Utils ===
        let vrmBaseRotations = null;
        const clamp01 = (v) => Math.min(1, Math.max(0, v));
        // lerp removal
        let smoothMouseX = 0.5;
        let smoothMouseY = 0.5;

        function applyRelaxedPose(vrm) {
            if (!vrm.humanoid) return;
            const DEG_TO_RAD = Math.PI / 180;

            // Brazos abajo
            const leftArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
            const rightArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
            if (leftArm) leftArm.rotation.z = 80 * DEG_TO_RAD;
            if (rightArm) rightArm.rotation.z = -80 * DEG_TO_RAD;

            // Antebrazos flexionados
            const leftLowArm = vrm.humanoid.getNormalizedBoneNode('leftLowerArm');
            const rightLowArm = vrm.humanoid.getNormalizedBoneNode('rightLowerArm');
            if (leftLowArm) leftLowArm.rotation.z = 10 * DEG_TO_RAD;
            if (rightLowArm) rightLowArm.rotation.z = -10 * DEG_TO_RAD;

            // === FIX DE ROTACIÓN ===
            // 1. Configurar orden de rotación a YXZ para Head/Neck/Spine
            const head = vrm.humanoid.getNormalizedBoneNode('head');
            const neck = vrm.humanoid.getNormalizedBoneNode('neck');
            const spine = vrm.humanoid.getNormalizedBoneNode('spine');

            if (head) head.rotation.order = 'YXZ';
            if (neck) neck.rotation.order = 'YXZ';
            if (spine) spine.rotation.order = 'YXZ';

            // 2. Guardar rotaciones base (Quaternions)
            vrmBaseRotations = {
                head: head ? head.quaternion.clone() : new THREE.Quaternion(),
                neck: neck ? neck.quaternion.clone() : new THREE.Quaternion(),
                spine: spine ? spine.quaternion.clone() : new THREE.Quaternion()
            };

            console.log('[VRM] Pose relajada aplicada y rotaciones base guardadas');
        }

        // Guardar el estado completo de todos los huesos (quaternion + posicion)
        // Se llama UNA vez despues de init + applyRelaxedPose
        function saveVRMRestPose(vrm) {
            if (!vrm?.humanoid) return;
            vrmRestPose = {};
            const allBones = [
                'hips', 'spine', 'chest', 'upperChest', 'neck', 'head',
                'leftShoulder', 'leftUpperArm', 'leftLowerArm', 'leftHand',
                'rightShoulder', 'rightUpperArm', 'rightLowerArm', 'rightHand',
                'leftUpperLeg', 'leftLowerLeg', 'leftFoot', 'leftToes',
                'rightUpperLeg', 'rightLowerLeg', 'rightFoot', 'rightToes'
            ];
            allBones.forEach(name => {
                const bone = vrm.humanoid.getNormalizedBoneNode(name);
                if (bone) {
                    vrmRestPose[name] = {
                        quaternion: bone.quaternion.clone(),
                        position: bone.position.clone()
                    };
                }
            });
            console.log('[VRM] Rest pose guardada:', Object.keys(vrmRestPose).length, 'huesos');
        }

        // Restaurar el estado exacto de todos los huesos al estado inicial
        function restoreVRMRestPose(vrm) {
            if (!vrm?.humanoid || !vrmRestPose) return;
            for (const name in vrmRestPose) {
                const bone = vrm.humanoid.getNormalizedBoneNode(name);
                if (bone) {
                    bone.quaternion.copy(vrmRestPose[name].quaternion);
                    bone.position.copy(vrmRestPose[name].position);
                }
            }
            // Recalcular base rotations para sistemas de mirada/idle
            const head = vrm.humanoid.getNormalizedBoneNode('head');
            const neck = vrm.humanoid.getNormalizedBoneNode('neck');
            const spine = vrm.humanoid.getNormalizedBoneNode('spine');
            vrmBaseRotations = {
                head: head ? head.quaternion.clone() : new THREE.Quaternion(),
                neck: neck ? neck.quaternion.clone() : new THREE.Quaternion(),
                spine: spine ? spine.quaternion.clone() : new THREE.Quaternion()
            };
            console.log('[VRM] Rest pose restaurada');
        }

        // === VRM: Idle Animation (respiración y balanceo sutil) ===
        let idleTimer = 0;
        function updateIdleAnimation(delta) {
            if (!currentVRM || !currentVRM.humanoid || !vrmBaseRotations) return;

            idleTimer += delta;

            // Respiración: movimiento sutil del pecho
            const breathAmount = Math.sin(idleTimer * 1.2) * 0.008;
            const chest = currentVRM.humanoid.getNormalizedBoneNode('chest');
            if (chest) {
                // Aplicar sobre la rotación base del chest
                const baseChestQ = vrmBaseRotations.spine; // Usamos spine como referencia
                const breathQ = new THREE.Quaternion()
                    .setFromEuler(new THREE.Euler(breathAmount, 0, 0, 'YXZ'));
                // No modificar directamente el chest aquí porque 
                // updateVRMGaze ya maneja spine/neck/head
            }

            // Balanceo corporal muy sutil
            const swayAmount = Math.sin(idleTimer * 0.4) * 0.005;
            const spine = currentVRM.humanoid.getNormalizedBoneNode('spine');
            if (spine && vrmBaseRotations.spine) {
                // Añadir sway al spine (se suma al movimiento del look)
                const currentQ = spine.quaternion.clone();
                const swayQ = new THREE.Quaternion()
                    .setFromEuler(new THREE.Euler(0, swayAmount, swayAmount * 0.5, 'YXZ'));
                spine.quaternion.multiply(swayQ);
            }
        }

        // === VRM: Actualizar LookAt (ojos/cabeza) ===
        function updateVRMGaze() {
            if (!currentVRM || !currentVRM.humanoid || !vrmBaseRotations) return;

            // === Smoothing del input ===
            const LERP_FACTOR = 0.1;
            smoothMouseX = lerp(smoothMouseX, clamp01(targetMouseX), LERP_FACTOR);
            smoothMouseY = lerp(smoothMouseY, clamp01(targetMouseY), LERP_FACTOR);

            // 1. Actualizar target de ojos (existente) con valores suavizados
            if (currentVRM.lookAt && currentVRM.lookAt.target) {
                const lookAtTarget = currentVRM.lookAt.target;
                lookAtTarget.position.set(
                    (smoothMouseX - 0.5) * 5,
                    (0.5 - smoothMouseY) * 5 + 1.25,
                    0
                );
            }

            // === Rotación con Quaternions (Offset desde Base) ===
            // Limites en radianes (reducidos para evitar "cuello roto")
            const MAX_YAW = 35 * (Math.PI / 180);   // Izquierda/Derecha
            const MAX_PITCH = 25 * (Math.PI / 180); // Arriba/Abajo

            // Yaw positivo = girar a la derecha cuando mouse va a la derecha
            const yaw = (smoothMouseX - 0.5) * 2 * MAX_YAW;
            // Pitch negativo = mirar arriba cuando mouse va arriba
            const pitch = (0.5 - smoothMouseY) * 2 * MAX_PITCH;

            // Crear Quaternions de rotación delta para cada hueso
            // Usamos factores diferentes para distribuir el movimiento
            const IDENTITY = new THREE.Quaternion();

            const head = currentVRM.humanoid.getNormalizedBoneNode('head');
            const neck = currentVRM.humanoid.getNormalizedBoneNode('neck');
            const spine = currentVRM.humanoid.getNormalizedBoneNode('spine');

            // Aplicar rotaciones proporcionales a cada hueso
            if (spine) {
                const spineYaw = yaw * 0.1;
                const spinePitch = pitch * 0.05;
                const qSpine = new THREE.Quaternion()
                    .setFromEuler(new THREE.Euler(spinePitch, spineYaw, 0, 'YXZ'));
                spine.quaternion.copy(vrmBaseRotations.spine).multiply(qSpine);
            }
            if (neck) {
                const neckYaw = yaw * 0.4;
                const neckPitch = pitch * 0.3;
                const qNeck = new THREE.Quaternion()
                    .setFromEuler(new THREE.Euler(neckPitch, neckYaw, 0, 'YXZ'));
                neck.quaternion.copy(vrmBaseRotations.neck).multiply(qNeck);
            }
            if (head) {
                const headYaw = yaw * 0.5;
                const headPitch = pitch * 0.65;
                const qHead = new THREE.Quaternion()
                    .setFromEuler(new THREE.Euler(headPitch, headYaw, 0, 'YXZ'));
                head.quaternion.copy(vrmBaseRotations.head).multiply(qHead);
            }
        }
        // === FUNCIONES DE ANIMACION FBX ===

        // Eliminar tracks de posicion (root motion) de un clip para hacerlo in-place
        function removePositionTracks(clip) {
            if (!clip) return clip;
            clip.tracks = clip.tracks.filter(track => !track.name.endsWith('.position'));
            return clip;
        }

        // Cargar y retarguetear animaciones FBX para uso con VRM
        async function loadRetargetedAnimations(vrm) {
            try {
                const fbxLoader = new FBXLoader();

                // Hello (saludo/despedida)
                const helloFBX = await fbxLoader.loadAsync('./assets/animations/Hello.fbx');
                animationClips.hello = removePositionTracks(retargetAnimation(helloFBX, vrm));
                console.log('[Animaciones] Clip hello cargado:', !!animationClips.hello);

                // Using Tablet
                const tabletFBX = await fbxLoader.loadAsync('./assets/animations/Using Tablet.fbx');
                animationClips.tablet = removePositionTracks(retargetAnimation(tabletFBX, vrm));
                console.log('[Animaciones] Clip tablet cargado:', !!animationClips.tablet);

                console.log('[Animaciones] Todos los clips cargados:', Object.keys(animationClips));
            } catch (error) {
                console.error('[Animaciones] Error cargando FBX:', error);
            }
        }

        // Cargar modelo 3D de la tablet
        async function loadTabletModel() {
            try {
                const gltfLoader = new GLTFLoader();
                const gltf = await gltfLoader.loadAsync('./assets/items/low_poly_sci-fi_tablet.glb');
                tabletModel = gltf.scene;
                tabletModel.scale.setScalar(0.08);
                tabletModel.visible = false;
                // No agregar a la escena aun, se adjunta al bone cuando se usa
                console.log('[Animaciones] Modelo tablet cargado');
            } catch (error) {
                console.error('[Animaciones] Error cargando tablet GLB:', error);
            }
        }

        // Reproducir una animacion retargueteada
        function playAnimation(clipName, options = {}) {
            if (!currentVRM || !animationClips[clipName]) {
                console.warn('[Animaciones] No se puede reproducir:', clipName);
                return;
            }

            const {
                loop = false,
                speed = 1.0,
                onComplete = null,
                returnToIdle = true
            } = options;

            // Destruir mixer anterior para liberar bindings sobre los huesos
            if (animMixer) {
                animMixer.stopAllAction();
                animMixer.uncacheRoot(currentVRM.scene);
                animMixer = null;
            }

            // Crear mixer nuevo limpio
            animMixer = new THREE.AnimationMixer(currentVRM.scene);

            const action = animMixer.clipAction(animationClips[clipName]);
            action.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce);
            action.timeScale = speed;
            action.clampWhenFinished = true;
            action.reset().play();

            isPlayingClipAnimation = true;
            motionPlaying = true;
            console.log('[Animaciones] Reproduciendo:', clipName, 'loop:', loop, 'speed:', speed);

            // Callback al terminar (solo si no es loop)
            if (!loop) {
                const onFinished = () => {
                    animMixer.removeEventListener('finished', onFinished);

                    // Liberar control del mixer sobre los huesos
                    animMixer.stopAllAction();
                    animMixer.uncacheRoot(currentVRM.scene);
                    animMixer = null;

                    isPlayingClipAnimation = false;
                    motionPlaying = false;

                    // Restaurar pose al estado inicial exacto
                    if (returnToIdle && currentVRM) {
                        restoreVRMRestPose(currentVRM);
                    }
                    if (onComplete) onComplete();
                    console.log('[Animaciones] Clip finalizado:', clipName);
                };
                animMixer.addEventListener('finished', onFinished);
            }
        }

        // Detener animacion activa y volver a idle
        function stopAnimation() {
            // Destruir mixer completamente para liberar bindings
            if (animMixer) {
                animMixer.stopAllAction();
                if (currentVRM) {
                    animMixer.uncacheRoot(currentVRM.scene);
                }
                animMixer = null;
            }
            isPlayingClipAnimation = false;
            motionPlaying = false;

            // Restaurar todos los huesos al estado inicial
            if (currentVRM) {
                restoreVRMRestPose(currentVRM);
            }

            // Despegar tablet del bone y ocultar
            if (tabletModel) {
                if (tabletModel.parent && tabletModel.parent !== scene) {
                    tabletModel.parent.remove(tabletModel);
                    scene.add(tabletModel);
                }
                tabletModel.visible = false;
            }
            console.log('[Animaciones] Animacion detenida, volviendo a idle');
        }

        // Iniciar animacion de tablet (adjuntar modelo a la mano)
        // Lee posicion/rotacion/escala desde model-config.json (items.tablet)
        function startTabletAnimation() {
            if (tabletModel && currentVRM?.humanoid) {
                const leftHand = currentVRM.humanoid.getNormalizedBoneNode('leftHand');
                if (leftHand) {
                    leftHand.add(tabletModel);
                    tabletModel.visible = true;

                    // Leer config guardada o usar valores por defecto
                    const tabletCfg = currentConfig.items?.tablet || {};
                    const pos = tabletCfg.position || { x: 0.02, y: 0.06, z: 0.03 };
                    const rot = tabletCfg.rotation || { x: -0.52, y: 2.24, z: 0 };
                    const scl = tabletCfg.scale || 1.0;

                    tabletModel.position.set(pos.x, pos.y, pos.z);
                    tabletModel.rotation.set(rot.x, rot.y, rot.z);
                    tabletModel.scale.setScalar(scl * 0.08); // 0.08 es la escala base del modelo GLB
                }
            }

            playAnimation('tablet', {
                loop: true,
                onComplete: null
            });
        }

        // === MAIN ANIMATION LOOP ===
        function animationLoop() {
            requestAnimationFrame(animationLoop);

            const delta = clock.getDelta();

            // Animaciones por clip (FBX retargueteadas)
            if (animMixer && isPlayingClipAnimation) {
                animMixer.update(delta);
            }

            // Animaciones procedurales (solo si no hay clip activo)
            if (!isPlayingClipAnimation) {
                updateVRMGaze();
                updateIdleAnimation(delta);
            }

            // Siempre activos independientemente del modo
            updateBlink(delta);
            updateLipSync();

            // Update VRM internals (SpringBones, etc)
            if (currentVRM) {
                currentVRM.update(delta);
            }

            // Render
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // Sistema de subtítulos con typewriter effect
        function showSubtitle(text, isYui = false) {
            console.log('[Subtítulos] showSubtitle llamado:', text, 'isYui:', isYui);
            if (!subtitleElement) {
                console.error('[Subtítulos] subtitleElement no encontrado!');
                return;
            }

            // Cancelar typewriter anterior si existe
            if (typewriterTimeout) {
                clearTimeout(typewriterTimeout);
            }

            // Configurar clase de estilo
            subtitleElement.className = isYui ? 'yui-text' : 'user-text';
            subtitleElement.classList.add('show');

            // Efecto typewriter
            subtitleElement.textContent = '';
            currentTypewriterIndex = 0;

            function typeNextChar() {
                if (currentTypewriterIndex < text.length) {
                    subtitleElement.textContent += text[currentTypewriterIndex];
                    currentTypewriterIndex++;
                    typewriterTimeout = setTimeout(typeNextChar, TYPEWRITER_SPEED);
                }
            }

            typeNextChar();
        }

        function hideSubtitle() {
            if (!subtitleElement) return;
            if (typewriterTimeout) {
                clearTimeout(typewriterTimeout);
            }
            subtitleElement.classList.remove('show');
            subtitleElement.textContent = '';
        }

        // Conectar WebSocket para subtítulos
        let wsReconnectCount = 0;
        function connectSubtitleWebSocket() {
            wsReconnectCount++;
            console.log(`[Subtítulos] Intento de conexión WebSocket #${wsReconnectCount} a ws://localhost:58765`);

            ws = new WebSocket('ws://localhost:58765');
            window.ws = ws; // Exponer globalmente para mute global

            ws.onopen = () => {
                console.log('[Subtítulos] WebSocket conectado');
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);

                    if (message.type === 'transcript') {
                        // Mostrar transcripción del usuario inmediatamente
                        const text = message.data?.text || '';
                        if (text) {
                            showSubtitle(text, false);
                            // Auto-ocultar después de 3 segundos
                            setTimeout(hideSubtitle, 3000);
                        }
                    }
                    else if (message.type === 'response') {
                        // Solo guardar respuesta, NO mostrar aquí
                        pendingYuiResponse = message.data?.text || '';
                    }
                    // === ANIMACION ===
                    else if (message.type === 'tts_start') {
                        // TTS INICIA - mostrar subtítulo sincronizado con audio
                        const text = message.data?.text || '';

                        // Lip-sync: guardar utteranceId y marcar como hablando
                        currentUtteranceId = message.data?.utteranceId || null;
                        isSpeaking = true;
                        smoothedMouthOpen = 0;

                        if (text) {
                            console.log('[Subtítulos] TTS iniciando, mostrando:', text);

                            // Cancelar timer anterior si existe
                            if (subtitleHideTimer) {
                                clearTimeout(subtitleHideTimer);
                                console.log('[Subtítulos] Timer anterior cancelado');
                            }

                            showSubtitle(text, true);  // TRUE = es de Yui, fondo morado
                            pendingYuiResponse = null; // Limpiar pendiente

                            // Duración proporcional: min 5s, +150ms por carácter
                            const duration = Math.max(5000, text.length * 150);
                            console.log(`[Subtítulos] Duración calculada: ${duration}ms para ${text.length} caracteres`);

                            subtitleHideTimer = setTimeout(() => {
                                console.log('[Subtítulos] Timer completado, ocultando');
                                hideSubtitle();
                            }, duration);
                        }
                    }
                    else if (message.type === 'tts_complete') {
                        // TTS completó - resetear lip-sync
                        console.log('[Subtítulos] TTS completado');
                        if (message.data?.utteranceId === currentUtteranceId) {
                            isSpeaking = false;
                            smoothedMouthOpen = 0;
                            currentUtteranceId = null;
                        }
                    }
                    else if (message.type === 'set_expression') {
                        // Cambiar expresion del modelo VRM
                        const expressionName = message.data?.name || '';
                        if (currentVRM?.expressionManager && expressionName) {
                            try {
                                // Resetear expresiones primero
                                ['happy', 'sad', 'angry', 'surprised', 'neutral'].forEach(exp => {
                                    currentVRM.expressionManager.setValue(exp, 0);
                                });

                                // Aplicar nueva expresion si no es neutral
                                if (expressionName !== 'neutral') {
                                    const weight = isSpeaking ? 0.3 : 0.7;
                                    currentVRM.expressionManager.setValue(expressionName, weight);
                                    console.log('[Expresion] VRM aplicada:', expressionName, 'peso:', weight);
                                } else {
                                    console.log('[Expresion] VRM reset a neutral');
                                }

                                // Aplicar postura corporal
                                applyPosturePreset(expressionName);
                            } catch (e) {
                                console.error('[Expresion] Error aplicando VRM:', e);
                            }
                        }
                    }
                    else if (message.type === 'lipsync_frame') {
                        // Lip-sync desde TTS microservicio
                        if (message.utteranceId === currentUtteranceId) {
                            smoothedMouthOpen += (message.mouthOpen - smoothedMouthOpen) * LIP_LERP_SPEED;
                        }
                    }
                } catch (e) {
                    console.error('[Subtítulos] Error:', e);
                }
            };

            ws.onerror = (error) => {
                console.error('[Subtítulos] WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('[Subtítulos] WebSocket cerrado, reconectando en 3s...');
                setTimeout(connectSubtitleWebSocket, 3000);
            };
        }

        async function init() {
            const loadingMsg = document.getElementById('loadingMsg');
            const canvas = document.getElementById('live2d-canvas');
            const container = document.getElementById('canvas-container');

            // Inicializar elemento de subtítulos
            subtitleElement = document.getElementById('subtitle-text');

            // Conectar WebSocket para subtítulos con delay inicial
            console.log('[Subtítulos] Esperando 2s antes de conectar WebSocket...');
            setTimeout(() => {
                connectSubtitleWebSocket();
            }, 2000);

            currentConfig = await loadConfig();
            currentScale = currentConfig.scale || 1.0;

            // Cargar configuracion de subtitulos guardada
            if (currentConfig.subtitles) {
                if (currentConfig.subtitles.yPosition) {
                    subtitleConfig.yPosition = currentConfig.subtitles.yPosition;
                }
                if (currentConfig.subtitles.fontSize) {
                    subtitleConfig.fontSize = currentConfig.subtitles.fontSize;
                }
                if (currentConfig.subtitles.maxWidth) {
                    subtitleConfig.maxWidth = currentConfig.subtitles.maxWidth;
                }
                const subtitleContainer = document.getElementById('subtitle-container');
                subtitleContainer.style.top = subtitleConfig.yPosition + '%';
                subtitleElement.style.fontSize = subtitleConfig.fontSize + 'px';
                subtitleElement.style.maxWidth = subtitleConfig.maxWidth + 'px';
                console.log('[Subtitulos] Configuracion cargada:', subtitleConfig);
            }

            // === THREE.JS SETUP ===
            const width = 400;
            const height = 500;
            canvasRect = { width, height };

            // Crear renderer con transparencia
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true,
                antialias: true
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            // Crear escena
            scene = new THREE.Scene();

            // Crear cámara ortográfica para aspecto 2D
            const aspect = width / height;
            camera = new THREE.OrthographicCamera(
                -aspect, aspect,  // left, right
                1, -1,            // top, bottom
                0.1, 20           // near, far
            );
            camera.position.set(0, 1, 5);
            camera.lookAt(0, 1, 0);

            // Luz ambiental base
            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            // Luz direccional principal (necesaria para MToon shader)
            directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(0, 1, 1); // Desde arriba-frente
            scene.add(directionalLight);

            // Segunda luz direccional (relleno desde el lado)
            fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
            fillLight.position.set(-1, 0.5, 0.5);
            scene.add(fillLight);

            // Cargar brillo guardado (ajusta todas las luces)
            if (currentConfig.brightness !== undefined) {
                const b = currentConfig.brightness;
                ambientLight.intensity = 0.6 * b;
                directionalLight.intensity = 1.0 * b;
                fillLight.intensity = 0.5 * b;
            }

            try {
                // === CARGAR VRM ===
                const loader = new GLTFLoader();

                // Registrar plugin con nuestro loader MToon seguro
                loader.register((parser) => {
                    const mtoonPlugin = new SafeMToonMaterialLoaderPlugin(parser);
                    return new VRMLoaderPlugin(parser, { mtoonMaterialPlugin: mtoonPlugin });
                });

                console.log('[VRM] Cargando modelo:', currentConfig.modelPath);
                const gltf = await loader.loadAsync(currentConfig.modelPath);
                const vrm = gltf.userData.vrm;

                if (!vrm) {
                    throw new Error('No se encontró VRM en el archivo');
                }

                // Rotar el modelo (VRM viene mirando hacia +Z)
                VRMUtils.rotateVRM0(vrm);

                currentVRM = vrm;
                scene.add(vrm.scene);

                // Log expresiones disponibles
                if (vrm.expressionManager) {
                    const presets = Object.keys(vrm.expressionManager.presetExpressionMap || {});
                    const customs = Object.keys(vrm.expressionManager.customExpressionMap || {});
                    console.log('[VRM] Expresiones disponibles:');
                    console.log('  Presets:', presets);
                    console.log('  Custom:', customs);
                }

                // Ajustar posición y escala
                vrm.scene.scale.setScalar(currentScale);

                if (currentConfig.position) {
                    vrm.scene.position.set(currentConfig.position.x, currentConfig.position.y, 0);
                    console.log('[VRM] Posición restaurada:', currentConfig.position);
                }

                // === LOOK AT SETUP ===
                // Crear un objeto target para que el VRM lo mire
                const lookAtTarget = new THREE.Object3D();
                camera.add(lookAtTarget); // Lo vinculamos a la cámara o escena

                if (vrm.lookAt) {
                    vrm.lookAt.target = lookAtTarget;
                    vrm.lookAt.autoUpdate = true;
                }

                // Aplicar pose inicial relajada
                applyRelaxedPose(vrm);

                // Guardar estado completo de huesos despues de la pose inicial
                saveVRMRestPose(vrm);

                // Cargar animaciones FBX retargueteadas y modelo de tablet
                await loadRetargetedAnimations(vrm);
                await loadTabletModel();

                loadingMsg.style.display = 'none';
                console.log('[VRM] Modelo cargado exitosamente');


                // Wheel para escala (Zoom) o rotacion de items
                window.addEventListener('wheel', (e) => {
                    // Modo ajuste de items: scroll rota la tablet
                    if (itemConfigMode && tabletModel && tabletModel.visible) {
                        e.preventDefault();
                        const step = e.deltaY > 0 ? -0.05 : 0.05;

                        if (e.shiftKey) {
                            // Shift + Scroll = rotar eje X
                            tabletModel.rotation.x += step;
                        } else if (e.ctrlKey) {
                            // Ctrl + Scroll = rotar eje Z
                            tabletModel.rotation.z += step;
                        } else {
                            // Scroll solo = rotar eje Y
                            tabletModel.rotation.y += step;
                        }

                        // Guardar en config
                        if (!currentConfig.items) currentConfig.items = {};
                        if (!currentConfig.items.tablet) currentConfig.items.tablet = {};
                        currentConfig.items.tablet.rotation = {
                            x: tabletModel.rotation.x,
                            y: tabletModel.rotation.y,
                            z: tabletModel.rotation.z
                        };
                        console.log(`[Items] Rotacion tablet: X=${tabletModel.rotation.x.toFixed(2)} Y=${tabletModel.rotation.y.toFixed(2)} Z=${tabletModel.rotation.z.toFixed(2)}`);
                        scheduleAutoSave();
                        return;
                    }

                    // Modo normal: zoom del modelo
                    if (!e.ctrlKey && !configModeEnabled) return;

                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -0.1 : 0.1;
                    currentScale = Math.max(0.1, Math.min(5.0, currentScale + delta));

                    if (currentVRM) {
                        currentVRM.scene.scale.setScalar(currentScale);
                    }
                    console.log(`[Zoom] Nueva escala: ${currentScale.toFixed(2)}`);
                    scheduleAutoSave();
                }, { passive: false });

                // Drag del Modelo (Pan) o movimiento de Items con Clic Derecho
                let isPanning = false;
                let panStartX = 0;
                let panStartY = 0;
                let modelStartPos = new THREE.Vector3();
                let itemStartPos = new THREE.Vector3();

                window.addEventListener('mousedown', (e) => {
                    // 2 = Click Derecho
                    if (e.button === 2) {
                        isPanning = true;
                        panStartX = e.clientX;
                        panStartY = e.clientY;

                        if (itemConfigMode && tabletModel && tabletModel.visible) {
                            // Modo items: guardar posicion inicial de la tablet
                            itemStartPos.copy(tabletModel.position);
                        } else if (currentVRM) {
                            modelStartPos.copy(currentVRM.scene.position);
                        }
                        e.preventDefault();
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isPanning) return;

                    if (itemConfigMode && tabletModel && tabletModel.visible) {
                        // Modo items: mover posicion de la tablet
                        const sensitivity = 0.0005;
                        const dx = (e.clientX - panStartX) * sensitivity;
                        const dy = (e.clientY - panStartY) * sensitivity;

                        tabletModel.position.set(
                            itemStartPos.x + dx,
                            itemStartPos.y - dy,
                            itemStartPos.z
                        );

                        // Guardar en config
                        if (!currentConfig.items) currentConfig.items = {};
                        if (!currentConfig.items.tablet) currentConfig.items.tablet = {};
                        currentConfig.items.tablet.position = {
                            x: tabletModel.position.x,
                            y: tabletModel.position.y,
                            z: tabletModel.position.z
                        };
                    } else if (currentVRM) {
                        // Modo normal: mover modelo VRM
                        const sensitivity = 0.0025 * (5 / camera.position.z);
                        const dx = (e.clientX - panStartX) * sensitivity * 2.5;
                        const dy = (e.clientY - panStartY) * sensitivity * 2.5;

                        currentVRM.scene.position.set(
                            modelStartPos.x + dx,
                            modelStartPos.y - dy,
                            modelStartPos.z
                        );

                        if (!currentConfig.position) currentConfig.position = {};
                        currentConfig.position.x = currentVRM.scene.position.x;
                        currentConfig.position.y = currentVRM.scene.position.y;
                    }
                });

                window.addEventListener('mouseup', (e) => {
                    if (isPanning) {
                        isPanning = false;
                        scheduleAutoSave();
                        if (itemConfigMode) {
                            console.log('[Items] Nueva posicion tablet:', tabletModel?.position);
                        } else {
                            console.log('[Pan] Nueva posicion:', currentVRM?.scene.position);
                        }
                    }
                });

                // Prevenir menú contextual del click derecho
                window.addEventListener('contextmenu', (e) => e.preventDefault());

                // NOTA: No cerramos el try aquí, sigue para abajo...

                // Drag de la ventana (movimiento del app)
                // Usamos variables separadas para no confundir con Pan de VRM
                // Drag de la ventana (movimiento del app)
                let appDragStartX = 0;
                let appDragStartY = 0;

                // 1. Mousedown
                document.addEventListener('mousedown', (e) => {
                    if (!document.body.classList.contains('drag-mode')) return;
                    isDragging = true;
                    appDragStartX = e.screenX;
                    appDragStartY = e.screenY;
                });

                // 2. Mousemove
                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;

                    const deltaX = e.screenX - appDragStartX;
                    const deltaY = e.screenY - appDragStartY;

                    appDragStartX = e.screenX;
                    appDragStartY = e.screenY;

                    const currentPos = { x: window.screenX, y: window.screenY };
                    window.electronAPI?.setWindowPosition(
                        currentPos.x + deltaX,
                        currentPos.y + deltaY
                    );
                });

                // 3. Mouseup
                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                // Mouse tracking global
                window.electronAPI?.startMouseTracking();
                window.electronAPI?.onMousePosition((pos) => {
                    const centerX = canvasRect.width / 2;
                    const centerY = canvasRect.height / 2;
                    targetX = (pos.x - centerX) / canvasRect.width;
                    targetY = (pos.y - centerY) / canvasRect.height;
                });

                // Resetear clock para evitar delta acumulado durante carga
                clock.getDelta();

                // Iniciar loop de animacion
                animationLoop();

                // Saludo inicial (despues de que el loop esta corriendo)
                setTimeout(() => {
                    playAnimation('hello', {
                        speed: 1.0,
                        returnToIdle: true
                    });
                }, 200);

            } catch (error) {
                console.error('[VRM] Error cargando modelo:', error);
                showError('Error fatal cargando VRM:\n' + error.message);
            }
        } // End init()

        function showError(message) {
            document.getElementById('loadingMsg').style.display = 'none';
            const container = document.getElementById('canvas-container');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            container.appendChild(errorDiv);
        }

        // Escuchar modos desde el tray
        window.electronAPI?.onConfigMode((enabled) => {
            configModeEnabled = enabled;
            document.body.classList.toggle('config-mode', enabled);
        });

        // Modo ajuste de items 3D
        window.electronAPI?.onItemConfigMode?.((enabled) => {
            itemConfigMode = enabled;
            const itemPanel = document.getElementById('item-controls');
            if (itemPanel) {
                itemPanel.classList.toggle('show', enabled);
                // Posicionar al lado opuesto de Yui en la pantalla
                const screenMid = screen.width / 2;
                const windowCenter = window.screenX + (window.innerWidth / 2);
                if (windowCenter > screenMid) {
                    // Yui esta a la derecha, panel a la izquierda
                    itemPanel.style.right = 'auto';
                    itemPanel.style.left = '10px';
                } else {
                    // Yui esta a la izquierda, panel a la derecha
                    itemPanel.style.left = 'auto';
                    itemPanel.style.right = '10px';
                }
            }
            console.log('[Items] Modo ajuste:', enabled ? 'ACTIVADO' : 'DESACTIVADO');
            // Al activar, mostrar tablet para poder ajustarla
            if (enabled && tabletModel && !tabletModel.visible) {
                startTabletAnimation();
            }
        });

        window.electronAPI?.onDragMode((enabled) => {
            document.body.classList.toggle('drag-mode', enabled);
        });

        window.electronAPI?.onPassthroughMode((enabled) => {
            document.body.classList.toggle('translucent-mode', enabled);
        });

        window.electronAPI?.onMouseTracking((enabled) => {
            mouseTrackingEnabled = enabled;
            if (!enabled) {
                // Reset target a posicion neutral
                targetX = 0.5;
                targetY = 0.5;
                targetMouseX = 0.5;
                targetMouseY = 0.5;
                // Mouse tracking desactivado: Yui usa su tablet
                startTabletAnimation();
            } else {
                // Mouse tracking reactivado: Yui guarda la tablet
                stopAnimation();
            }
        });

        // Brillo (intensidad de todas las luces)
        window.electronAPI?.onBrightness?.((value) => {
            const b = value;
            if (ambientLight) ambientLight.intensity = 0.6 * b;
            if (directionalLight) directionalLight.intensity = 1.0 * b;
            if (fillLight) fillLight.intensity = 0.5 * b;
            console.log('[Brillo] Ajustado a:', value);
        });
        window.electronAPI?.onExpression((name) => {
            if (!currentVRM?.expressionManager) {
                console.log('[Expression] Error: VRM no cargado');
                return;
            }
            console.log('[Expression] Aplicando:', name || 'neutral');
            try {
                // Primero resetear todas las expresiones
                const expressions = ['happy', 'sad', 'angry', 'surprised', 'neutral'];
                expressions.forEach(exp => {
                    currentVRM.expressionManager.setValue(exp, 0);
                });

                // Aplicar nueva expresión
                if (name && name !== 'neutral') {
                    // Peso reducido si está hablando (lip-sync tiene prioridad)
                    const weight = isSpeaking ? 0.3 : 0.7;
                    currentVRM.expressionManager.setValue(name, weight);
                    console.log('[Expression] Aplicada:', name, 'peso:', weight);
                } else {
                    console.log('[Expression] Reset a neutral');
                }

                // Aplicar postura corporal según emoción
                applyPosturePreset(name || 'neutral');
            } catch (e) {
                console.error('[Expression] Error:', e);
            }
        });


        // Resetear expresiones VRM
        window.electronAPI?.onMotionReset(() => {
            if (!currentVRM?.expressionManager) return;
            console.log('[Reset] Reseteando VRM a estado neutral...');
            try {
                // Resetear todas las expresiones
                const expressions = ['happy', 'sad', 'angry', 'surprised', 'neutral', 'aa', 'blink'];
                expressions.forEach(exp => {
                    currentVRM.expressionManager.setValue(exp, 0);
                });
                console.log('[Reset] Completado');
            } catch (e) {
                console.error('[Reset] Error:', e);
            }
        });
        // Animacion de despedida al cerrar la app
        window.electronAPI?.onAppClosing?.(() => {
            console.log('[Animaciones] App cerrando - reproduciendo despedida');
            stopAnimation();
            playAnimation('hello', {
                speed: 1.3,
                returnToIdle: false
            });
        });

        // === Funciones globales para controles de items (usadas por onclick en HTML) ===
        function saveItemConfig() {
            if (!currentConfig.items) currentConfig.items = {};
            if (!currentConfig.items.tablet) currentConfig.items.tablet = {};
            currentConfig.items.tablet.position = {
                x: tabletModel.position.x,
                y: tabletModel.position.y,
                z: tabletModel.position.z
            };
            currentConfig.items.tablet.rotation = {
                x: tabletModel.rotation.x,
                y: tabletModel.rotation.y,
                z: tabletModel.rotation.z
            };
            currentConfig.items.tablet.scale = tabletModel.scale.x / 0.08;
            scheduleAutoSave();
        }

        window.adjustItemPos = function (axis, delta) {
            if (!tabletModel || !tabletModel.visible) return;
            tabletModel.position[axis] += delta;
            console.log(`[Items] Posicion ${axis}: ${tabletModel.position[axis].toFixed(3)}`);
            saveItemConfig();
        };

        window.adjustItemRot = function (axis, delta) {
            if (!tabletModel || !tabletModel.visible) return;
            tabletModel.rotation[axis] += delta;
            console.log(`[Items] Rotacion ${axis}: ${tabletModel.rotation[axis].toFixed(3)}`);
            saveItemConfig();
        };

        window.adjustItemScale = function (delta) {
            if (!tabletModel || !tabletModel.visible) return;
            // Escala actual del modelo (base 0.08 * multiplicador)
            let currentMultiplier = tabletModel.scale.x / 0.08;
            currentMultiplier = Math.max(0.1, currentMultiplier + delta);
            tabletModel.scale.setScalar(currentMultiplier * 0.08);
            console.log(`[Items] Escala: ${currentMultiplier.toFixed(2)}x`);
            saveItemConfig();
        };

        window.addEventListener('load', init);
    </script>
</body>
